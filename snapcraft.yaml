name: lxqt-archiver
base: core26
version: '1.5.0'
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
summary: A simple & lightweight Qt file archiver.
description: |
  A simple & lightweight desktop-agnostic Qt file archiver
grade: stable
confinement: strict
icon: lxqt-archiver.svg

apps:
  lxqt-archiver:
    command: usr/bin/lxqt-archiver
    desktop: usr/share/applications/lxqt-archiver.desktop
    environment:
      HOME: $SNAP_REAL_HOME
      QT_QPA_PLATFORMTHEME: xdgdesktopportal
    extensions: [kde-neon-6]
    plugs:
      - home
      - removable-media
      - mount-observe

plugs:
  shared-memory:
    private: true

layout:
  /usr/share/lxqt-archiver/translations:
    symlink: $SNAP/usr/share/lxqt-archiver/translations
  /usr/lib/7zip:
    symlink: $SNAP/usr/lib/7zip
  /usr/bin/tar:
    bind-file: $SNAP/bin/disable

parts:
  lxqt-archiver-app:
    plugin: cmake
    source: https://github.com/lxqt/lxqt-archiver.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    build-packages:
      - pkg-config
      - libjson-glib-dev
      - libglib2.0-dev
      - libxcb-render0-dev
      - libxcb-shape0-dev
      - libxcb-xfixes0-dev
      - libxcb-shm0-dev
      - libxcb-util-dev
      - libxcb-composite0-dev
      - libxcb-cursor-dev
      - libxcb-damage0-dev
      - libxcb-dpms0-dev
      - libxcb-dri2-0-dev
      - libxcb-dri3-dev
      - libxcb-ewmh-dev
      - libxcb-glx0-dev
      - libxcb-icccm4-dev
      - libxcb-keysyms1-dev
      - libxcb-present-dev
      - libxcb-record0-dev
      - libxcb-res0-dev
      - libxcb-screensaver0-dev
      - libxcb-xf86dri0-dev
      - libxcb-xinerama0-dev
      - libxcb-xinput-dev
      - libxcb-xkb-dev
      - libxcb-xtest0-dev
      - libxcb-xv0-dev
      - libxcb-xvmc0-dev
      - libexif-dev
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr

  archiving-tools:
    after: [lxqt-archiver-app]
    plugin: nil
    stage-packages: [zip, unzip, rar, 7zip, 7zip-rar, xz-utils, zstd, rpm2cpio, gzip, bzip2, bzip3]
